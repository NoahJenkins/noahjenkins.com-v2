name: Dependabot auto-merge

# Metadata only. Do not check out pull request code: this job enables auto-merge
# and must not run candidate code with a write token.
on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  automerge:
    name: Dependabot auto-merge
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      # alert-lookup stays off. That lookup needs a PAT or App token that can
      # read vulnerability alerts; a 403 fails metadata for every update.
      # Security updates are recognized from the groups in dependabot.yml
      # (npm-security, github-actions-security). GHSA outputs are still honored
      # when metadata provides them.
      - name: Enable auto-merge for patch, minor, Actions, and security updates
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          UPDATE_TYPE: ${{ steps.meta.outputs.update-type }}
          ECOSYSTEM: ${{ steps.meta.outputs.package-ecosystem }}
          DEPENDENCY_GROUP: ${{ steps.meta.outputs.dependency-group }}
          GHSA_ID: ${{ steps.meta.outputs.ghsa-id }}
          ALERT_STATE: ${{ steps.meta.outputs.alert-state }}
        run: |
          set -euo pipefail
          update_type="${UPDATE_TYPE:-}"
          ecosystem="${ECOSYSTEM:-}"
          group="${DEPENDENCY_GROUP:-}"
          ghsa="${GHSA_ID:-}"
          alert_state="${ALERT_STATE:-}"
          pr_url="${PR_URL:?}"
          merge=false
          case "$update_type" in
            version-update:semver-patch|version-update:semver-minor) merge=true ;;
          esac
          case "$ecosystem" in
            github_actions|github-actions) merge=true ;;
          esac
          case "$group" in
            npm-security|github-actions-security) merge=true ;;
          esac
          if printf '%s' "$ghsa" | grep -q 'GHSA-' && printf '%s' "$alert_state" | grep -Eq '(^|,)[[:space:]]*(OPEN|FIXED)[[:space:]]*(,|$)'; then
            merge=true
          fi
          if [ "$merge" = true ]; then
            echo "Enabling squash auto-merge (${update_type:-unknown}; ${ecosystem:-unknown}; ${group:-none})."
            if ! gh pr merge --auto --squash "$pr_url"; then
              method=$(gh pr view "$pr_url" --json autoMergeRequest --jq '.autoMergeRequest.mergeMethod // ""')
              if [ "$method" != "SQUASH" ]; then
                echo "::error::Unable to enable squash auto-merge."
                exit 1
              fi
              echo "Squash auto-merge is already enabled."
            fi
          else
            echo "Leaving ${update_type:-unclassified} for review."
            if ! gh pr edit "$pr_url" --add-label "needs-review"; then
              echo "::warning::Could not add needs-review label. The pull request was not set to auto-merge."
            fi
          fi
