name: Dependabot Controller

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, edited, ready_for_review, converted_to_draft]
  workflow_run:
    workflows: [CI]
    types: [completed]
  status:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

# Privileged jobs read default-branch code only. Never checkout or execute a PR.
permissions:
  contents: read
  pull-requests: read
  issues: read
  checks: read
  actions: read

# One authority for global daily quotas. Reconcile all open PRs on each signal.
concurrency:
  group: dependabot-controller-${{ github.repository }}
  cancel-in-progress: false

jobs:
  controller:
    name: Reconcile Dependabot PRs
    if: vars.DEPENDABOT_CONTROLLER_APP_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      tasks: ${{ steps.reconcile.outputs.tasks }}
      has_tasks: ${{ steps.reconcile.outputs.has_tasks }}
      app_slug: ${{ steps.app-token.outputs.app-slug }}
    steps:
      - name: Checkout trusted controller
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Create scoped controller token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.DEPENDABOT_CONTROLLER_APP_ID }}
          private-key: ${{ secrets.DEPENDABOT_CONTROLLER_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-checks: write
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
          permission-actions: read
          permission-administration: read
      - name: Reconcile current heads
        id: reconcile
        run: node .github/scripts/dependabot-controller-run.cjs controller
        env:
          DEPENDABOT_READ_TOKEN: ${{ steps.app-token.outputs.token }}
          DEPENDABOT_APP_TOKEN: ${{ steps.app-token.outputs.token }}
          DEPENDABOT_CONTROLLER_APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          DEPENDABOT_CONTROLLER_APP_ID: ${{ vars.DEPENDABOT_CONTROLLER_APP_ID }}
          DEPENDABOT_STATE_ISSUE_NUMBER: ${{ vars.DEPENDABOT_STATE_ISSUE_NUMBER }}
          DEPENDABOT_DISPATCH_USER_ID: ${{ vars.DEPENDABOT_DISPATCH_USER_ID }}
          DEPENDABOT_REVIEWER_ID: ${{ vars.DEPENDABOT_REVIEWER_ID }}
          DEPENDABOT_VERCEL_APP_ID: ${{ vars.DEPENDABOT_VERCEL_APP_ID }}
          DEPENDABOT_AUTOMATION_ENABLED: ${{ vars.DEPENDABOT_AUTOMATION_ENABLED }}
          DEPENDABOT_AGENT_ENABLED: ${{ vars.DEPENDABOT_AGENT_ENABLED }}

  dispatch:
    name: Dispatch reserved Copilot work
    needs: controller
    if: needs.controller.outputs.has_tasks == 'true' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted dispatcher
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Verify and dispatch reservations
        run: node .github/scripts/dependabot-controller-run.cjs dispatch
        env:
          DEPENDABOT_READ_TOKEN: ${{ github.token }}
          COPILOT_AUTOMATION_TOKEN: ${{ secrets.COPILOT_AUTOMATION_TOKEN }}
          DEPENDABOT_TASKS: ${{ needs.controller.outputs.tasks }}
          DEPENDABOT_CONTROLLER_APP_SLUG: ${{ needs.controller.outputs.app_slug }}
          DEPENDABOT_CONTROLLER_APP_ID: ${{ vars.DEPENDABOT_CONTROLLER_APP_ID }}
          DEPENDABOT_STATE_ISSUE_NUMBER: ${{ vars.DEPENDABOT_STATE_ISSUE_NUMBER }}
          DEPENDABOT_DISPATCH_USER_ID: ${{ vars.DEPENDABOT_DISPATCH_USER_ID }}
          DEPENDABOT_REVIEWER_ID: ${{ vars.DEPENDABOT_REVIEWER_ID }}
          DEPENDABOT_VERCEL_APP_ID: ${{ vars.DEPENDABOT_VERCEL_APP_ID }}
          DEPENDABOT_AUTOMATION_ENABLED: ${{ vars.DEPENDABOT_AUTOMATION_ENABLED }}
          DEPENDABOT_AGENT_ENABLED: ${{ vars.DEPENDABOT_AGENT_ENABLED }}
